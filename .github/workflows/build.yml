name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get electrs version
        id: version
        run: echo "VERSION=$(grep 'ARG VERSION=' Dockerfile | sed 's/ARG VERSION=//;s/"//g')" >> $GITHUB_OUTPUT

      - name: Build and Push Image (amd64)
        env:
          IMG_NAME: ghcr.io/${{ github.repository_owner }}/electrs
          DOCKER_USER: waltersouto
          ELECTRS_VERSION: ${{ steps.version.outputs.VERSION }}
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMG_NAME }}:latest
            ${{ env.IMG_NAME }}:${{ github.ref_name }}
            ${{ env.DOCKER_USER }}/electrs:latest
            ${{ env.DOCKER_USER }}/electrs:v${{ env.ELECTRS_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
